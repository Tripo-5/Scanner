<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Web Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>🔍 Scanner Web Dashboard</h1>

    <div class="section">
        <h2>📡 Proxy Management</h2>
        <button onclick="sendRequest('/proxies/scrape', 'Proxies Scraped!')">Scrape Proxies</button>
        <button onclick="sendRequest('/proxies/load', 'Proxies Loaded!')">Load Proxies</button>
        <button onclick="sendRequest('/proxies/test', 'Proxy Testing Started!')">Test Proxies</button>
        <button onclick="sendRequest('/proxies/save', 'Valid Proxies Saved!')">Save Proxies</button>
        <button onclick="sendRequest('/proxies/load-checked', 'Checked Proxies Loaded!')">Load Checked Proxies</button>
    </div>

    <div class="section">
        <h2>🌐 Host Management</h2>
        <button onclick="sendRequest('/hosts/load', 'Hosts Loaded!')">Load Hosts</button>
        <button onclick="sendRequest('/hosts/test', 'Host Testing Started!')">Test Hosts</button>
        <button onclick="sendRequest('/hosts/scan', 'Host Scanning Started!')">Scan Hosts</button>
    </div>

    <div class="section">
        <h2>🔑 Brute-force</h2>
        <button onclick="sendRequest('/bruteforce/start', 'Brute-force Started!')">Start Brute-force</button>
        <button onclick="sendRequest('/bruteforce/stop', 'Brute-force Stopped!')">Stop Brute-force</button>
    </div>

    <div class="section">
        <h2>💀 Shell Generator</h2>
        <button onclick="sendRequest('/shell/generate', 'Payload Generated!')">Generate Reverse Shell</button>
    </div>

    <div class="section">
        <h2>🖥 Command & Control</h2>
        <button onclick="sendRequest('/c2/start', 'C2 Server Started!')">Start C2 Server</button>
        <button onclick="sendRequest('/c2/stop', 'C2 Server Stopped!')">Stop C2 Server</button>
    </div>

    <div class="section">
        <h2>🧅 Tor Proxy</h2>
        <button onclick="sendRequest('/tor/start', 'Tor Started!')">Start Tor</button>
        <button onclick="sendRequest('/tor/renew', 'New Tor IP!')">Renew Tor IP</button>
        <button onclick="sendRequest('/tor/stop', 'Tor Stopped!')">Stop Tor</button>
    </div>

    <div class="section">
        <h2>⚙ System</h2>
        <button onclick="sendRequest('/stats', 'Refreshing Stats...')">View Stats</button>
        <button onclick="sendRequest('/exit', 'Stopping All Services!')">Exit Scanner</button>
    </div>

    <script>
        function sendRequest(endpoint, successMessage) {
            fetch(endpoint, { method: "POST" })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert("Error: " + data.error);
                } else {
                    alert(successMessage);
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>

</body>
</html>
