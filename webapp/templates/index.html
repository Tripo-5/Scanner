<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">

    <div class="container mt-5">
        <h1 class="text-center">📡 Scanner Dashboard</h1>

        <div class="row mt-4">
            <!-- Proxies Stats -->
            <div class="col-md-4">
                <div class="card bg-secondary">
                    <div class="card-body">
                        <h5 class="card-title">📡 Proxies</h5>
                        <p>Total: <span id="total_proxies">0</span></p>
                        <p>Valid: <span class="text-success" id="valid_proxies">0</span></p>
                        <p>Dead: <span class="text-danger" id="dead_proxies">0</span></p>
                        <button class="btn btn-primary" onclick="startProxyTest()">Start Proxy Test</button>
                    </div>
                </div>
            </div>

            <!-- Hosts Stats -->
            <div class="col-md-4">
                <div class="card bg-secondary">
                    <div class="card-body">
                        <h5 class="card-title">🌐 Hosts</h5>
                        <p>Total: <span id="total_hosts">0</span></p>
                        <p>Live: <span class="text-success" id="live_hosts">0</span></p>
                        <p>Dead: <span class="text-danger" id="dead_hosts">0</span></p>
                        <button class="btn btn-primary" onclick="startHostScan()">Start Host Scan</button>
                    </div>
                </div>
            </div>

            <!-- Brute-Force Stats -->
            <div class="col-md-4">
                <div class="card bg-secondary">
                    <div class="card-body">
                        <h5 class="card-title">🔑 Brute-force</h5>
                        <p>Running: <span id="brute_running">0</span></p>
                        <p>Success: <span class="text-success" id="brute_success">0</span></p>
                        <p>Failed: <span class="text-danger" id="brute_failed">0</span></p>
                        <button class="btn btn-danger" onclick="startBruteForce()">Start Brute-force</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
